<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Login Successful</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap">
  <style>
    :root {
      --canvas: #1d1d1d;
      --card: #f4f6f5;
      --border: #dfe4e1;
      --ink: #14241d;
      --muted: #6b7a73;
      --green: #1a6b52;
      --green-hover: #155944;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--canvas);
      color: var(--ink);
      font-family: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
    }

    .stage {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px 20px;
    }

    .card {
      width: 100%;
      max-width: 440px;
      padding: 38px 40px 40px;
      border-radius: 14px;
      background: var(--card);
    }

    .eyebrow {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 16px;
      color: var(--green);
      font-size: 12px;
      font-weight: 600;
      letter-spacing: .04em;
      text-transform: uppercase;
    }

    .eyebrow::before {
      content: "";
      width: 18px;
      height: 2px;
      background: var(--green);
    }

    h1 {
      margin: 0 0 10px;
      font-size: 30px;
      line-height: 1.25;
    }

    .sub {
      margin: 0 0 28px;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.5;
    }

    .details {
      margin-bottom: 20px;
      padding: 18px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: #fff;
    }

    .details-label {
      margin: 0 0 6px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 600;
    }

    .username {
      margin: 0;
      font-size: 20px;
      font-weight: 600;
    }

    .btn {
      width: 100%;
      height: 48px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border: 0;
      border-radius: 8px;
      background: var(--green);
      color: #fff;
      font-size: 15px;
      font-weight: 600;
      text-decoration: none;
      transition: background .15s;
    }

    .btn:hover { background: var(--green-hover); }

    @media (max-width: 640px) {
      .stage { padding: 24px 16px; }
      .card { padding: 28px 24px 30px; }
      h1 { font-size: 26px; }
    }
  </style>
</head>
<body>
  <main class="stage">
    <section class="card" aria-labelledby="success-title">
      <div class="eyebrow">Login successful</div>
      <h1 id="success-title">Welcome back</h1>
      <p class="sub">You are now signed in to your account.</p>

      <div class="details">
        <p class="details-label">Logged in as</p>
        <p class="username">{{ request.user.username }}</p>
      </div>

      <a class="btn" href="{% url 'logout' %}">Log out</a>
    </section>
  </main>
</body>
</html>
