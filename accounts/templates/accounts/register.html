<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Register</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap">
<style>
  :root {
    --canvas: #1d1d1d;
    --card: #f4f6f5;
    --field: #ffffff;
    --border: #dfe4e1;
    --ink: #14241d;
    --muted: #6b7a73;
    --green: #1a6b52;
    --green-hover: #155944;
    --label: #a9aeab;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --canvas: #161616;
      --card: #f4f6f5;
      --field: #ffffff;
      --border: #dfe4e1;
      --ink: #14241d;
      --muted: #6b7a73;
      --green: #1a6b52;
      --green-hover: #155944;
      --label: #a9aeab;
    }
  }
  :root[data-theme="dark"] {
    --canvas: #161616;
  }
  *, *::before, *::after { box-sizing: border-box; }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); }
  body {
    margin: 0;
    background: var(--canvas);
    color: var(--ink);
    font-family: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
  }
  .stage {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 0;
    padding: 40px 20px 56px;
  }
  .panel { width: 100%; max-width: 270px; }
  .stage { min-height: 100vh; align-items: center; }
  .panel-name { color: var(--label); font-size: 12px; margin: 0 0 14px; }
  .card {
    background: var(--card);
    border-radius: 12px;
    padding: 24px 25px 26px;
    width: 100%;
  }
  .eyebrow {
    display: flex; align-items: center; gap: 6px;
    font-size: 9px; font-weight: 600; letter-spacing: .04em;
    color: var(--green); text-transform: uppercase; margin-bottom: 12px;
  }
  .eyebrow::before { content: ""; width: 14px; height: 2px; background: var(--green); }
  h1 { font-size: 18px; line-height: 1.25; font-weight: 600; margin: 0 0 8px; letter-spacing: -.01em; }
  .sub { font-size: 9.5px; color: var(--muted); margin: 0 0 20px; }
  .field { margin-bottom: 14px; }
  label.lbl { display: block; font-size: 9px; font-weight: 500; margin-bottom: 6px; }
  .input-wrap { position: relative; }
  input[type="text"], input[type="email"], input[type="password"] {
    width: 100%; height: 28px;
    background: var(--field); border: 1px solid var(--border); border-radius: 6px;
    padding: 0 10px; font: inherit; font-size: 9px; color: var(--ink);
  }
  input::placeholder { color: var(--muted); opacity: .85; }
  input:focus-visible { outline: 2px solid var(--green); outline-offset: 1px; border-color: transparent; }
  .input-wrap input { padding-right: 40px; }
  .toggle {
    position: absolute; right: 8px; top: 50%; transform: translateY(-50%);
    background: none; border: 0; padding: 2px 3px; cursor: pointer;
    font: inherit; font-size: 8px; font-weight: 500; color: var(--ink);
  }
  .toggle:focus-visible, a:focus-visible, .btn:focus-visible, .check input:focus-visible {
    outline: 2px solid var(--green); outline-offset: 2px; border-radius: 3px;
  }
  .row { display: flex; align-items: center; justify-content: space-between; margin: 2px 0 14px; }
  .check { display: flex; align-items: center; gap: 6px; font-size: 8px; color: var(--muted); cursor: pointer; }
  .check input { width: 10px; height: 10px; margin: 0; accent-color: var(--green); }
  a { color: var(--green); font-weight: 600; text-decoration: none; }
  a:hover { text-decoration: underline; }
  .row a { font-size: 8px; }
  .hint { font-size: 7.5px; color: var(--muted); margin: -6px 0 14px; }
  .btn {
    width: 100%; height: 28px; border: 0; border-radius: 6px;
    background: var(--green); color: #fff; font: inherit; font-size: 9px; font-weight: 500; cursor: pointer;
    transition: background .15s;
  }
  .btn:hover { background: var(--green-hover); }
  .switch {
    margin: 16px 0 0; padding-top: 14px; border-top: 1px solid var(--border);
    text-align: center; font-size: 8px; color: var(--muted);
  }
  .switch a { margin-left: 2px; }
  .error { color: #b3261e; font-size: 8px; margin-top: 4px; display: none; }
  .field.invalid .error { display: block; }
  .field.invalid input { border-color: #b3261e; }
  .status { font-size: 8.5px; color: var(--green); text-align: center; margin: 10px 0 0; min-height: 12px; }
  @media (max-width: 640px) {
    .panel { max-width: 340px; }
  }
</style>
</head>
<body>
<main class="stage">
<section class="panel" aria-labelledby="register-title">
    <form class="card" id="register-form" novalidate>
      <div class="eyebrow">Get started</div>
      <h1 id="register-title">Create your account</h1>
      <p class="sub">A fresh start, just a few details away.</p>

      <div class="field">
        <label class="lbl" for="reg-name">Full name</label>
        <input type="text" id="reg-name" name="name" placeholder="Enter your full name" autocomplete="name" required>
        <div class="error">Enter your full name.</div>
      </div>

      <div class="field">
        <label class="lbl" for="reg-email">Email address</label>
        <input type="email" id="reg-email" name="email" placeholder="you@example.com" autocomplete="email" required>
        <div class="error">Enter a valid email address.</div>
      </div>

      <div class="field">
        <label class="lbl" for="reg-password">Password</label>
        <div class="input-wrap">
          <input type="password" id="reg-password" name="password" placeholder="Create a password" autocomplete="new-password" required>
          <button type="button" class="toggle" data-target="reg-password" aria-label="Show password">Show</button>
        </div>
        <div class="error">Use at least 8 characters, including a number.</div>
      </div>
      <p class="hint">Use at least 8 characters, including a number.</p>

      <button type="submit" class="btn">Create account</button>
      <p class="status" id="register-status" role="status"></p>

      <p class="switch">Already have an account? <a href="{% url 'login' %}">Log in</a></p>
    </form>
  </section>
</main>

<script>
// Show / hide password
  document.querySelectorAll('.toggle').forEach(function (btn) {
    btn.addEventListener('click', function () {
      var input = document.getElementById(btn.dataset.target);
      var show = input.type === 'password';
      input.type = show ? 'text' : 'password';
      btn.textContent = show ? 'Hide' : 'Show';
      btn.setAttribute('aria-label', show ? 'Hide password' : 'Show password');
    });
  });

  function setInvalid(input, bad) {
    input.closest('.field').classList.toggle('invalid', bad);
  }
  var emailOk = function (v) { return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v); };

  // Register
  document.getElementById('register-form').addEventListener('submit', function (e) {
    e.preventDefault();
    var name = this.elements.name, email = this.elements.email, pass = this.elements.password;
    var nameOk = name.value.trim().length > 1;
    var passOk = pass.value.length >= 8 && /\d/.test(pass.value);
    setInvalid(name, !nameOk);
    setInvalid(email, !emailOk(email.value));
    setInvalid(pass, !passOk);
    var ok = nameOk && emailOk(email.value) && passOk;
    document.getElementById('register-status').textContent = ok ? 'Creating your account…' : '';
    // TODO: send { name, email, password } to your backend here
  });
</script>
</body>
</html>
